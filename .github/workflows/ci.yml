name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore src/PayLink.Api/PayLink.Api.sln

      - name: Build
        run: dotnet build src/PayLink.Api/PayLink.Api.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/PayLink.Api.Tests/PayLink.Api.Tests.csproj --configuration Release --no-build --verbosity normal